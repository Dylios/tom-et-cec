<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Expedition 2028 — Le Dernier Chapitre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

  <!-- =========================
       ÉCRAN TITRE
  ========================== -->

  <section id="title-screen" class="screen active">

    <div class="title-content">

      <p class="title-small">UNE HISTOIRE À ÉCRIRE</p>

      <h1>EXPEDITION 2028</h1>

      <h2>Le Dernier Chapitre</h2>

      <div class="title-line"></div>

      <button id="start-button" class="game-button">
        Commencer l'expédition
      </button>

      <p class="title-footer">
        Thomas &amp; Cécile
      </p>

    </div>

  </section>


  <!-- =========================
       PROLOGUE
  ========================== -->

  <section id="prologue-screen" class="screen">

    <div class="prologue">

      <p class="chapter-label">PROLOGUE</p>

      <h2>
        Avant que l'histoire<br>
        ne commence...
      </h2>

      <p>Certaines histoires sont écrites à l'avance.</p>
      <p>D'autres commencent par hasard.</p>

      <button id="enter-world-button" class="game-button">
        Entrer dans l'histoire
      </button>

    </div>

  </section>


  <!-- =========================
       JEU
  ========================== -->

<section id="game-screen" class="screen">

  <div class="game-container">

    <div class="game-wrapper">

      <canvas
        id="game-canvas"
        width="960"
        height="540">
      </canvas>

      <div
        id="dialogue-box"
        class="dialogue hidden">

        <div
          id="dialogue-name"
          class="dialogue-name">
        </div>

        <div
          id="dialogue-text"
          class="dialogue-text">
        </div>

        <div class="dialogue-continue">
          ▼
        </div>

      </div>

      <div
        id="interaction-hint"
        class="interaction-hint hidden">
        E — Interagir
      </div>

    </div>


    <!-- CONTRÔLES MOBILES -->

    <div id="mobile-controls">

      <div
        id="joystick"
        class="joystick">

        <div
          id="joystick-knob"
          class="joystick-knob">
        </div>

      </div>

      <button
        id="action-button"
        class="action-button"
        type="button">
        A
      </button>

    </div>


    <div class="game-help">

      <span class="desktop-help">
        ↑ ↓ ← → / ZQSD
      </span>

      <span class="desktop-help">
        E : interagir
      </span>

      <span class="mobile-help">
        Joystick : déplacer
      </span>

      <span class="mobile-help">
        A : interagir
      </span>

    </div>

  </div>

</section>

</main>

<script src="js/map.js"></script>
<script src="js/environment.js"></script>
<script src="js/player.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/characters.js"></script>
<script src="js/interaction.js"></script>
<script src="js/game.js"></script>

</body>
</html>
